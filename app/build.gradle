plugins {
    id 'com.android.application'
}

android {
    namespace 'de.assimoe.libremirror'
    compileSdk 35

    defaultConfig {
        applicationId 'de.assimoe.libremirror'
        minSdk 26
        targetSdk 33
        versionCode 110
        versionName '1.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
