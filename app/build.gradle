plugins {
    id 'com.android.application'
}

android {
    namespace 'de.assimoe.libremirror'
    compileSdk 35

    defaultConfig {
        applicationId 'de.assimoe.libremirror'
        minSdk 26
        targetSdk 33
        versionCode 5
        versionName '0.3.2-libreview-report'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
