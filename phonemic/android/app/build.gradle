plugins { id 'com.android.application' }

android {
    namespace 'de.underground.phonemic'
    compileSdk 35

    defaultConfig {
        applicationId 'de.underground.phonemic'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
